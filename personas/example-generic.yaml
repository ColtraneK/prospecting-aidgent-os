# Example persona (FAKE, public). A real persona is written by your agent from
# the ICP conversation and saved with `npm run save-persona`, which puts it
# under private/personas/ where git never sees it. Everything here is invented.
#
# The split: `icp`, `topics` and `voice` are GUIDANCE the agent judges against.
# `hard_exclusions` and `geography` are HARD LINES the code enforces.

persona: Example Generic Persona

offer: >
  Practical workflow automation for small service businesses that need fewer
  manual handoffs without buying a large enterprise platform.

buyer_roles:
  - Owner
  - Founder
  - Head of Operations
  - Operations Director

company_profile: >
  Independent B2B service businesses with roughly 5-50 people and a visible
  client-delivery workflow.

# Prose, not fields. The agent reads this to judge fit, so write it the way
# you would brief a sharp colleague: who buys, what they look like on
# LinkedIn, and what makes someone worth reaching THIS WEEK.
icp: >
  Owners and operations leads of 1-50 person service businesses in the US and
  Canada — professional services, local services, B2B software — who are
  drowning in recurring operational busywork. The buyer is the person who
  personally feels the dropped balls: they post about being overwhelmed,
  about hiring before they are ready, or about trying to automate a workflow
  themselves. Someone writing about scaling pain this week beats a perfect
  title who has not posted in a year.

# Substrings. Any match against title/company/headline is a hard disqualify,
# enforced in code — the one list the agent cannot judge its way around.
hard_exclusions:
  - student
  - job seeker
  - recruiter
  - agency that sells the same service

geography:
  include:
    - United States
    - Canada
  exclude:
    - India   # example exclusion only

# Search STARTING POINTS, not query strings. The agent turns these into real
# public web searches using references/public-web-sourcing.md.
topics:
  - drowning in ops busywork
  - hiring an operations manager
  - automating client onboarding
  - scaling a small team

trigger_signals:
  - hiring an operations role
  - launching a new service
  - complaining about manual onboarding
  - growing faster than the current process can handle

follow_up_days: 5

# How an opener should sound. The agent drafts; the grounding validator checks.
voice: >
  Warm, concise, curious, no pitch. React to the specific thing they said —
  quote their own words back. One light question at the end. Never "came
  across your profile", never a link, never a call ask in the first message.

# Point this at YOUR Google Sheet (bind-sheet writes it for you).
# This example ID is fake and will not resolve.
sheet_id: EXAMPLE_SHEET_ID_replace_me
